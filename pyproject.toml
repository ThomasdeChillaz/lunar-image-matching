[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-image-matching"
version = "0.2.0"
description = "Auditable lunar matching experiments and a validated research interface"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = ["numpy==1.26.4", "opencv-python==4.10.0.84"]

[project.scripts]
lunar-match = "lunar_matching.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
