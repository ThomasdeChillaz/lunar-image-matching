name: Solar five-arm native CPU comparison v115
run-name: solar-five-arm-v115-${{ inputs.ticket_nonce }}

on:
  workflow_dispatch:
    inputs:
      ticket_commit:
        description: Exact GitHub-verified v115 ticket commit
        required: true
        type: string
      ticket:
        description: Exact published v115 ticket path
        required: true
        type: string
      ticket_sha256:
        description: Exact published v115 ticket SHA256
        required: true
        type: string
      ticket_nonce:
        description: Fresh one-use v115 nonce
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: solar-five-arm-v115-${{ inputs.ticket_nonce }}
  cancel-in-progress: false

jobs:
  native-cpu:
    if: >-
      github.repository == 'ThomasdeChillaz/lunar-image-matching' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.run_attempt == '1' &&
      github.ref == format('refs/heads/solar-five-arm-v115-ticket-{0}', inputs.ticket_nonce) &&
      github.sha == inputs.ticket_commit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      VECLIB_MAXIMUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      TORCH_HOME: ${{ github.workspace }}/data/models/modern-v2-torch-cache
      TICKET_COMMIT: ${{ inputs.ticket_commit }}
      TICKET_PATH: ${{ inputs.ticket }}
      TICKET_SHA256: ${{ inputs.ticket_sha256 }}
      TICKET_NONCE: ${{ inputs.ticket_nonce }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - name: Reject stale, duplicate or misbound tickets before setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python solar_remote_relay_five_arm_v115.py verify-ticket --ticket "$TICKET_PATH" --ticket-sha256 "$TICKET_SHA256" --ticket-nonce "$TICKET_NONCE" --ticket-commit "$TICKET_COMMIT"
      - name: Require the same native BF16 resource profile
        run: python cpu_budget_v2.py --output runs/solar-arm-five-hardware-v115.json
      - name: Install the exact qualified ARM CPU wheels
        run: python -m pip install --no-deps --require-hashes -r requirements_arm_cp312_v113.txt
      - name: Run all five arms inside the one-use workflow deadline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python solar_remote_relay_five_arm_v115.py remote --ticket "$TICKET_PATH" --ticket-sha256 "$TICKET_SHA256" --ticket-nonce "$TICKET_NONCE" --ticket-commit "$TICKET_COMMIT"
      - name: Preserve outer watchdog and sealed scientific archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solar-five-arm-v115-${{ inputs.ticket_nonce }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            runs/solar-arm-five-hardware-v115.json
            runs/solar-remote-five-arm-v115/*/remote_watchdog.json
            runs/solar-remote-five-arm-v115/*/controller.log
            runs/solar-remote-five-arm-v115/*/scientific_results.zip
            reports/solar-remote-arm-five-v115-ticket.json.WORKER_CONTEXT.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve partial raw case output if parent packing was interrupted
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solar-five-arm-v115-${{ inputs.ticket_nonce }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}-partial
          path: runs/solar-five-arm-v115/comparison/
          if-no-files-found: ignore
          retention-days: 30
