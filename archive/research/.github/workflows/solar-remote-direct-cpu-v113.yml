name: Solar Direct-only native CPU qualification v113
run-name: solar-direct-v113-${{ inputs.ticket_nonce }}
on:
  workflow_dispatch:
    inputs:
      ticket_commit:
        description: Exact reviewed and verified ticket commit (full 40-character SHA)
        required: true
        type: string
      ticket:
        description: Published repository-relative one-use ticket
        required: true
        type: string
      ticket_sha256:
        description: Exact reviewed ticket SHA256
        required: true
        type: string
      ticket_nonce:
        description: Fresh one-use v113 nonce
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: solar-direct-v113-${{ inputs.ticket_nonce }}
  cancel-in-progress: false
jobs:
  native-cpu:
    if: >-
      github.repository == 'ThomasdeChillaz/lunar-image-matching' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.run_attempt == '1' &&
      github.ref == format('refs/heads/solar-direct-v113-ticket-{0}', inputs.ticket_nonce) &&
      github.sha == inputs.ticket_commit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      VECLIB_MAXIMUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      TORCH_HOME: ${{ github.workspace }}/data/models/modern-v2-torch-cache
      TICKET_COMMIT: ${{ inputs.ticket_commit }}
      TICKET_PATH: ${{ inputs.ticket }}
      TICKET_SHA256: ${{ inputs.ticket_sha256 }}
      TICKET_NONCE: ${{ inputs.ticket_nonce }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.15'
      - name: Reject stale, duplicate or misbound tickets before setup
        run: python solar_remote_relay_direct_v113.py verify-ticket --ticket "$TICKET_PATH" --ticket-sha256 "$TICKET_SHA256" --ticket-nonce "$TICKET_NONCE" --ticket-commit "$TICKET_COMMIT"
      - name: Require the same native BF16 resource profile
        run: python cpu_budget_v2.py --output runs/solar-arm-direct-hardware-v113.json
      - name: Install the preserved separate official CPU runtime
        run: python -m pip install --no-deps --require-hashes -r requirements_arm_cp312_v113.txt
      - name: Run the matched v113 evaluator through its fresh one-use parent watchdog
        run: python solar_remote_relay_direct_v113.py remote --ticket "$TICKET_PATH" --ticket-sha256 "$TICKET_SHA256" --ticket-nonce "$TICKET_NONCE" --ticket-commit "$TICKET_COMMIT"
      - name: Preserve every completed or failed scientific output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solar-direct-v113-${{ inputs.ticket_nonce }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            runs/solar-arm-direct-hardware-v113.json
            runs/solar-remote-direct-v113/*/remote_watchdog.json
            runs/solar-remote-direct-v113/*/controller.log
            runs/solar-remote-direct-v113/*/scientific_results.zip
            reports/solar-remote-*.json.WORKER_CONTEXT.json
          if-no-files-found: warn
          retention-days: 30
