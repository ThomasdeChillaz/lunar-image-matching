name: Solar primary CPU crosscheck v75
run-name: solar-v75-${{ inputs.ticket_nonce }}
on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Published repository-relative one-use ticket
        required: true
        type: string
      ticket_sha256:
        description: Exact reviewed ticket SHA256
        required: true
        type: string
      ticket_nonce:
        description: Original one-use nonce
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: solar-v75-${{ inputs.ticket_nonce }}
  cancel-in-progress: false
jobs:
  native-cpu:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      VECLIB_MAXIMUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      TORCH_HOME: ${{ github.workspace }}/data/models/modern-v2-torch-cache
      TICKET_PATH: ${{ inputs.ticket }}
      TICKET_SHA256: ${{ inputs.ticket_sha256 }}
      TICKET_NONCE: ${{ inputs.ticket_nonce }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject stale, duplicate or misbound tickets before setup
        run: python solar_remote_relay_v75.py verify-ticket --ticket "$TICKET_PATH" --ticket-sha256 "$TICKET_SHA256" --ticket-nonce "$TICKET_NONCE"
      - name: Install the preserved separate official CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          python -m pip install numpy==1.26.4 opencv-python==4.10.0.84 pillow==12.0.0 einops==0.8.1 tqdm==4.67.1 rich==14.2.0 tyro==0.9.35 rasterio==1.4.4
      - name: Run the existing evaluator through the one-use parent watchdog
        run: python solar_remote_relay_v75.py remote --ticket "$TICKET_PATH" --ticket-sha256 "$TICKET_SHA256" --ticket-nonce "$TICKET_NONCE"
      - name: Preserve every completed or failed scientific output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-v75-${{ inputs.ticket_nonce }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            runs/solar-remote-v75/*/remote_watchdog.json
            runs/solar-remote-v75/*/controller.log
            runs/solar-remote-v75/*/scientific_results.zip
            reports/solar-remote-*.json.WORKER_CONTEXT.json
          if-no-files-found: warn
          retention-days: 30
