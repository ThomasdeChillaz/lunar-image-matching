name: Solar paired native modern CPU pilot v98
run-name: solar-v98-${{ inputs.ticket_nonce }}
on:
  workflow_dispatch:
    inputs:
      ticket_commit:
        description: Exact reviewed and verified ticket commit (full 40-character SHA)
        required: true
        type: string
      ticket:
        description: Published repository-relative one-use ticket
        required: true
        type: string
      ticket_sha256:
        description: Exact reviewed ticket SHA256
        required: true
        type: string
      ticket_nonce:
        description: Original one-use nonce
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: solar-v98-${{ inputs.ticket_nonce }}
  cancel-in-progress: false
jobs:
  native-cpu:
    if: >-
      github.repository == 'ThomasdeChillaz/lunar-image-matching' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.run_attempt == '1' &&
      github.ref == format('refs/heads/solar-v98-ticket-{0}', inputs.ticket_nonce) &&
      github.sha == inputs.ticket_commit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      VECLIB_MAXIMUM_THREADS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      TORCH_HOME: ${{ github.workspace }}/data/models/modern-v2-torch-cache
      TICKET_COMMIT: ${{ inputs.ticket_commit }}
      TICKET_PATH: ${{ inputs.ticket }}
      TICKET_SHA256: ${{ inputs.ticket_sha256 }}
      TICKET_NONCE: ${{ inputs.ticket_nonce }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject stale, duplicate or misbound tickets before setup
        run: python solar_remote_relay_v98.py verify-ticket --ticket "$TICKET_PATH" --ticket-sha256 "$TICKET_SHA256" --ticket-nonce "$TICKET_NONCE" --ticket-commit "$TICKET_COMMIT"
      - name: Require the same native BF16 resource profile
        run: python cpu_budget_v2.py --output runs/solar-arm-hardware-v98.json
      - name: Install the preserved separate official CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          python -m pip install numpy==1.26.4 opencv-python==4.10.0.84 pillow==12.0.0 einops==0.8.1 tqdm==4.67.1 rich==14.2.0 tyro==0.9.35 rasterio==1.4.4
      - name: Run the existing evaluator through the one-use parent watchdog
        run: python solar_remote_relay_v98.py remote --ticket "$TICKET_PATH" --ticket-sha256 "$TICKET_SHA256" --ticket-nonce "$TICKET_NONCE" --ticket-commit "$TICKET_COMMIT"
      - name: Preserve every completed or failed scientific output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-v98-${{ inputs.ticket_nonce }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            runs/solar-arm-hardware-v98.json
            runs/solar-remote-v98/*/remote_watchdog.json
            runs/solar-remote-v98/*/controller.log
            runs/solar-remote-v98/*/scientific_results.zip
            reports/solar-remote-*.json.WORKER_CONTEXT.json
          if-no-files-found: warn
          retention-days: 30
