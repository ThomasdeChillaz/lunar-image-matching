name: Modern v2 pretrained controls
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Standard free public runner
        type: choice
        options: [ubuntu-22.04, ubuntu-24.04-arm]
        default: ubuntu-22.04
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        method: [loma_b, loma_r, romav2]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TORCH_HOME: ${{ github.workspace }}/data/models/modern-v2-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check author BF16 CPU resource profile
        run: python3 cpu_budget_v2.py --output runs/hardware.json
      - name: Install isolated supported CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          python -m pip install numpy==1.26.4 opencv-python==4.10.0.84 pillow==12.0.0 einops==0.8.1 tqdm==4.67.1 rich==14.2.0 tyro==0.9.35 rasterio==1.4.4
      - name: Check out exact author source
        env:
          METHOD: ${{ matrix.method }}
        run: |
          python - <<'PY'
          import os,subprocess
          from modern_baselines_v2 import SOURCES
          family='romav2' if os.environ['METHOD']=='romav2' else 'loma'
          spec=SOURCES[family]
          subprocess.run(['git','clone',spec['url'],'upstream'],check=True)
          subprocess.run(['git','-C','upstream','checkout',spec['revision']],check=True)
          PY
      - name: Acquire exact weights with bounded retries
        env:
          METHOD: ${{ matrix.method }}
        run: python baseline_weights_v2.py --method "$METHOD" --output runs/acquisition.json
      - name: Execute actual common-profile software control
        env:
          METHOD: ${{ matrix.method }}
        run: |
          timeout 900s python modern_baselines_v2.py --method "$METHOD" --source upstream --output "runs/${METHOD}-common" --profile common
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-v2-${{ matrix.method }}-common-control
          path: runs/
          retention-days: 30
      - name: Execute author-profile control within free CPU budget
        id: author
        continue-on-error: true
        env:
          METHOD: ${{ matrix.method }}
        run: timeout 600s python modern_baselines_v2.py --method "$METHOD" --source upstream --output "runs/${METHOD}-author" --profile author
      - name: Require actual common pretrained control and retain author limitations
        env:
          METHOD: ${{ matrix.method }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          common=Path('runs')/(os.environ['METHOD']+'-common')/'probe.json'
          doc=json.loads(common.read_text())
          assert doc['status']=='passed',doc
          author=Path('runs')/(os.environ['METHOD']+'-author')/'probe.json'
          if not author.exists():
              author.parent.mkdir(parents=True,exist_ok=True)
              author.write_text(json.dumps(dict(status='blocked',method=os.environ['METHOD'],
                  profile='author',reason='Author-profile subprocess exceeded10minute free CPU budget or failed before completion; no inferred lunar result.')))
          PY
      - name: Capture exact runtime
        if: always()
        run: python -m pip freeze > runs/runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-v2-${{ matrix.method }}
          path: runs/
          retention-days: 30
          if-no-files-found: warn
