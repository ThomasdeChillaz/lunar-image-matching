name: Modern v2 pretrained controls
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/modern-v2-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        method: [loma_b, loma_r, romav2]
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TORCH_HOME: ${{ github.workspace }}/data/models/modern-v2-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated supported CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          python -m pip install numpy==1.26.4 opencv-python==4.10.0.84 pillow==12.0.0 einops==0.8.1 tqdm==4.67.1 rich==14.2.0 tyro==0.9.35 rasterio==1.4.4
      - name: Check out exact author source
        env:
          METHOD: ${{ matrix.method }}
        run: |
          python - <<'PY'
          import os,subprocess
          from modern_baselines_v2 import SOURCES
          family='romav2' if os.environ['METHOD']=='romav2' else 'loma'
          spec=SOURCES[family]
          subprocess.run(['git','clone',spec['url'],'upstream'],check=True)
          subprocess.run(['git','-C','upstream','checkout',spec['revision']],check=True)
          PY
      - name: Execute actual common and author-profile software controls
        env:
          METHOD: ${{ matrix.method }}
        run: |
          python modern_baselines_v2.py --method "$METHOD" --source upstream --output "runs/${METHOD}-common" --profile common
          python modern_baselines_v2.py --method "$METHOD" --source upstream --output "runs/${METHOD}-author" --profile author
      - name: Capture exact runtime
        if: always()
        run: python -m pip freeze > runs/runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-v2-${{ matrix.method }}
          path: runs/
          retention-days: 30
          if-no-files-found: warn
