name: Native lunar localization bounded case ranges
on:
  workflow_dispatch:
    inputs:
      method:
        type: choice
        options: [loma_r, romav2]
        default: loma_r
      profile:
        type: choice
        options: [common, author]
        default: common
      case_start:
        description: First index in the fixed72-case development list
        type: string
        default: '36'
      case_count:
        description: Number of consecutive fixed cases
        type: string
        default: '36'
      runner:
        description: Standard public CPU runner
        type: choice
        options: [ubuntu-22.04, ubuntu-24.04-arm]
        default: ubuntu-22.04
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '2'
      TORCH_HOME: ${{ github.workspace }}/data/models/modern-v2-cache
      METHOD: ${{ inputs.method }}
      PROFILE: ${{ inputs.profile }}
      CASE_START: ${{ inputs.case_start }}
      CASE_COUNT: ${{ inputs.case_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check unchanged author CPU resource profile
        run: python3 cpu_budget_v2.py --output runs/native-hardware.json
      - name: Install separate supported Linux CPU runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
          python -m pip install numpy==1.26.4 opencv-python==4.10.0.84 pillow==12.0.0 einops==0.8.1 tqdm==4.67.1 rich==14.2.0 tyro==0.9.35 rasterio==1.4.4
      - name: Install verified development-only geometry capsule
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request
          from dataset import sha256
          from package_localization_v3 import install
          base='https://github.com/ThomasdeChillaz/lunar-image-matching/releases/download/axial-geometry-v5/'
          path=Path('reports/axial-geometry-v5-capsule.zip')
          with urllib.request.urlopen(base+path.name,timeout=120) as response,path.open('wb') as output:
              while block:=response.read(1024*1024):output.write(block)
          assert sha256(path)==Path('reports/axial-geometry-v5-capsule.sha256').read_text().split()[0]
          install(path,'.')
          PY
      - name: Check out exact author implementation
        run: |
          python - <<'PY'
          import os,subprocess
          from modern_baselines_v2 import SOURCES
          spec=SOURCES['romav2' if os.environ['METHOD']=='romav2' else 'loma']
          subprocess.run(['git','clone',spec['url'],'upstream'],check=True)
          subprocess.run(['git','-C','upstream','checkout',spec['revision']],check=True)
          PY
      - name: Acquire exact official weights
        timeout-minutes: 20
        run: python -u baseline_weights_v2.py --method "$METHOD" --output runs/native-acquisition.json
      - name: Run actual native control then common-reference-geometry comparison
        run: timeout 3900s python -u native_baseline_pose_v8.py --case-start "$CASE_START" --case-count "$CASE_COUNT" --method "$METHOD" --source upstream --profile "$PROFILE" --output runs/native-comparison --max-seconds 3600
      - name: Capture supported runtime
        if: always()
        run: |
          mkdir -p runs
          python -m pip freeze > runs/native-runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-v8-${{ inputs.method }}-${{ inputs.profile }}-${{ inputs.case_start }}-${{ inputs.case_count }}
          path: |
            runs/native-comparison/
            runs/native-hardware.json
            runs/native-acquisition.json
            runs/native-runtime.txt
          retention-days: 30
          if-no-files-found: warn
